server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: config-provisioner
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Провизор трафик не обслуживает: готовность и живость — только ping.
        readiness:
          include: ping
        liveness:
          include: ping

# Провижер — сервисный бюджет соединений и стартовые значения ключей вновь зарегистрированного
# инстанса. maximumPoolSize — управляемый ключ (перезаписывается долей бюджета при пересчёте),
# остальные существующие ключи никогда не перезаписываются (txn put_if_absent).
provision:
  endpoints: ${PROV_ETCD_ENDPOINTS:http://localhost:2379}
  root: ${PROV_ETCD_ROOT:/config}
  # Бюджет соединений сервиса N: делится между активными инстансами, сумма долей по сервису = N.
  active-max-connections: ${PROV_ACTIVE_MAX_CONNECTIONS:100}
  # Минимальная доля активного инстанса: обслуживаются только те, кому досталось не меньше этого.
  active-min-connections: ${PROV_ACTIVE_MIN_CONNECTIONS:1}
  # Резерв неактивного флота R (0 = холод; 1..maxShare = тёплый пул ровно R). Активным достаётся
  # N − R×k; 0 из хранилища тоже валиден.
  inactive-max-connections: ${PROV_INACTIVE_MAX_CONNECTIONS:1}
  # Верхняя граница доли (зеркалит HikariSettings.POOL_SIZE_MAX у сервиса, доли усекаются).
  max-share: ${PROV_MAX_SHARE:200}
  connection-timeout-ms: ${PROV_CONNECTION_TIMEOUT_MS:3000}
  call-timeout: ${PROV_CALL_TIMEOUT:5s}
  retry-initial-backoff: ${PROV_RETRY_INITIAL:1s}
  retry-max-backoff: ${PROV_RETRY_MAX:30s}
  # Имя реплики для выборов лидера (пусто = фолбэк на hostname); TTL аренды выборов.
  name: ${PROV_NAME:}
  leader-ttl: ${PROV_LEADER_TTL:10s}

logging:
  level:
    com.example.provisioner: INFO
    io.etcd.jetcd: WARN