server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: config-provisioner
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Единая точка приёма сигналов: журналы, трассы и метрики уходят в otel-collector, который
  # отдаёт метрики сборщику в текстовом формате и кладёт трассы в Tempo, журналы — в Loki.
  # Текстовая точка /actuator/prometheus остаётся для человека.
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URL:http://otel-collector:4318/v1/metrics}
        step: ${OTEL_METRICS_STEP:5s}
        # Намертво заданные границы распределения прибора: смена умолчания Micrometer поехала бы
        # молча, а панель перцентилей молчала бы не об ошибке, а о другой величине.
        histogram-flavor: explicit_bucket_histogram
        # Единица времени в секундах, а не в миллисекундах (умолчание отправки): тогда имя
        # прибора в тексте получается тем же, что и на текстовой точке (…_seconds), и ни один
        # запрос в панелях и правилах не приходится переписывать при переходе на точку приёма.
        # Без этого приборы времени HTTP у провизёра приходили как …_milliseconds_* — измерено.
        base-time-unit: seconds
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://otel-collector:4318/v1/traces}
    logging:
      endpoint: ${OTEL_LOGS_URL:http://otel-collector:4318/v1/logs}
  tracing:
    sampling:
      # Доля запросов, которые попадают в трассу: на стенде смотреть всё (1.0), под долгой
      # нагрузкой помеху можно уменьшить (см. .env). События механизма отбираются всегда.
      probability: ${OTEL_TRACES_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      # Общий признак измерения повторяется в ресурсе сигнала: у метрик он общий тег, а у трасс
      # и журналов общих тегов нет, и без него в Tempo и Loki реплики неразличимы. service.instance.id
      # не задаётся намеренно: он превратился бы в признак instance на рядах метрик, а этот признак
      # у сборщика — адрес цели, и переопределять его нельзя.
      replica: ${PROV_NAME:unknown}
  metrics:
    tags:
      # Имя реплики — то же значение, что в ключе выборов, поэтому по метрикам видно, кто считал
      # величины. На стенде PROV_NAME задан явно; локально без него метка будет unknown, а выборы
      # пойдут по имени хоста (см. ProvisionerProperties.resolveName).
      replica: ${PROV_NAME:unknown}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Провизор трафик не обслуживает: готовность и живость — только ping.
        readiness:
          include: ping
        liveness:
          include: ping

# Провижер — сервисный бюджет соединений и стартовые значения ключей вновь зарегистрированного
# инстанса. maximumPoolSize — управляемый ключ (перезаписывается долей бюджета при пересчёте),
# остальные существующие ключи никогда не перезаписываются (txn put_if_absent).
provision:
  endpoints: ${PROV_ETCD_ENDPOINTS:http://localhost:2379}
  root: ${PROV_ETCD_ROOT:/config}
  # Бюджет соединений сервиса N: делится между активными инстансами, сумма долей по сервису = N.
  active-max-connections: ${PROV_ACTIVE_MAX_CONNECTIONS:100}
  # Минимальная доля активного инстанса: обслуживаются только те, кому досталось не меньше этого.
  active-min-connections: ${PROV_ACTIVE_MIN_CONNECTIONS:1}
  # Резерв неактивного флота R (0 = холод; 1..maxShare = тёплый пул ровно R). Активным достаётся
  # N − R×k; 0 из хранилища тоже валиден.
  inactive-max-connections: ${PROV_INACTIVE_MAX_CONNECTIONS:1}
  # Верхняя граница доли (зеркалит PoolSize.POOL_SIZE_MAX у сервиса, доли усекаются).
  max-share: ${PROV_MAX_SHARE:200}
  # Порог предупреждения о зависшем неосвобождённом сжатии: дольше него величина попадает в
  # журнал с числами, место при этом не перераспределяется (флот работает меньше бюджета).
  # 0 — не предупреждать.
  stuck-debt-warn-ms: ${PROV_STUCK_DEBT_WARN_MS:30000}
  call-timeout: ${PROV_CALL_TIMEOUT:5s}
  retry-initial-backoff: ${PROV_RETRY_INITIAL:1s}
  retry-max-backoff: ${PROV_RETRY_MAX:30s}
  # Имя реплики для выборов лидера (пусто = фолбэк на hostname); TTL аренды выборов.
  name: ${PROV_NAME:}
  leader-ttl: ${PROV_LEADER_TTL:10s}

logging:
  level:
    com.abatalev.demo.etcdhikari.provisor: INFO
    io.etcd.jetcd: WARN