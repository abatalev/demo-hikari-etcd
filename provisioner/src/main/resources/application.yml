server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: config-provisioner
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Провизор трафик не обслуживает: готовность и живость — только ping.
        readiness:
          include: ping
        liveness:
          include: ping

# Провижер — стартовые значения ключей вновь зарегистрированного инстанса.
# Существующие ключи никогда не перезаписываются (txn put_if_absent).
provision:
  endpoints: ${PROV_ETCD_ENDPOINTS:http://localhost:2379}
  root: ${PROV_ETCD_ROOT:/config}
  maximum-pool-size: ${PROV_MAX_POOL_SIZE:10}
  connection-timeout-ms: ${PROV_CONNECTION_TIMEOUT_MS:3000}
  call-timeout: ${PROV_CALL_TIMEOUT:5s}
  retry-initial-backoff: ${PROV_RETRY_INITIAL:1s}
  retry-max-backoff: ${PROV_RETRY_MAX:30s}
  # Имя реплики для выборов лидера (пусто = фолбэк на hostname); TTL аренды выборов.
  name: ${PROV_NAME:}
  leader-ttl: ${PROV_LEADER_TTL:10s}

logging:
  level:
    com.example.provisioner: INFO
    io.etcd.jetcd: WARN