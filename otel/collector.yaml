# Единая точка приёма сигналов стенда: otel-collector.
#
# Приложения шлют сюда все три сигнала по OTLP/HTTP (один порт 4318, три адреса сигнала) и ничего
# не знают о хранилищах: адрес у них один — otel-collector:4318. Дальше точка приёма решает, куда:
#   метрики — сборщику в текстовом формате (его prometheus-экспортёр отдаёт /metrics на 9464),
#   трассы  — в хранилище трасс, журналы — в хранилище журналов.
# Текстовая точка приложений /actuator/prometheus при этом остаётся: она больше не обслуживает
# сбор, а читается человеком (make pool, разбор вручную).
#
# Дверь не участвует ни в одной цепочке готовности (см. docker-compose.yml): её недоступность
# не должна мешать ни подъёму стенда, ни обслуживанию трафика.
receivers:
  otlp:
    protocols:
      # Только HTTP: приложения шлют OTLP/HTTP, а отдельный порт gRPC стенду не нужен.
      # Приём на всех адресах обязателен — внутри сети compose контейнер приходит по eth0.
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Ограничитель памяти стоит первым в конвейере: он возвращает отказ приёмнику, а тот ждёт и
  # повторяет отправку, тогда как процессор после него отбросил бы уже принятое. Без него до
  # жёсткого потолка cgroup (256 МиБ, см. docker-compose.yml) доходит сам docker и убивает дверь
  # вместе с уже принятыми трассами и журналами.
  #
  # В этой версии soft-потолок — это limit_mib МИНУС spike_limit_mib (так в документации точки
  # приёма: «soft limit = limit_mib − spike_limit_mib»), а spike_limit_mib — запас на прирост между
  # проверками, а не отдельный потолок. На стенде это стоило отброшенных метрик: при значениях
  # 224/196 soft-потолок равнялся 28 МиБ, и дверь отказывала в метриках всех десяти процессов при
  # 29 МиБ кучи, которые cgroup показывал как 74 МиБ.
  #
  # Ограничителей памяти три, по одному на сигнал, и это не redundancy, а приоритет. На стенде
  # выяснилось: когда хранилище трасс лежит (Tempo убит по памяти, 23 часа подряд «lookup tempo:
  # no such host»), двери нечем отправлять трассы, экспортёр копит пакеты и повторяет их с
  # нарастающей паузой, общий ограничитель видит растущую кучу и начинает отказывать во ВСЁМ — а
  # отказ в метриках выглядит как «весь флот молчит»: молчат правила молчания инстансов, и
  # разбор перехода невозможен. С общим ограничителем недоступность одного хранилища выключает
  # наблюдение целиком, то есть ровно то, ради чего наблюдение и вынесено в дверь.
  #
  # Порядок величин: у трасс потолок ниже всех, у метрик — выше всех. Отказ при нехватке памяти
  # получает первым тот сигнал, которым в этот момент меньше жертв, а метрики — по дежурству
  # последние: правила молчания и правила превышения бюджета читают именно их, и потеря метрик
  # означала бы потерю разбора, тогда как потеря трасс — потерю одного из трёх следов события.
  memory_limiter/traces:
    # Жёсткий потолок кучи для трасс: soft-потолок 128 − 32 = 96 МиБ.
    limit_mib: 128
    spike_limit_mib: 32
    check_interval: 1s
  memory_limiter/logs:
    # Журналы — между трассами и метриками: soft-потолок 144 − 32 = 112 МиБ.
    limit_mib: 144
    spike_limit_mib: 32
    check_interval: 1s
  memory_limiter/metrics:
    # Метрики отказываются последними: soft-потолок 192 − 48 = 144 МиБ кучи. Жёсткий потолок
    # выбран так, чтобы 192 МиБ кучи были примерно потолком контейнера 256 МиБ (процесс тратит
    # сверх кучи ещё стек и буферы приёмников — документация предупреждает о ~50 МиБ).
    limit_mib: 192
    spike_limit_mib: 48
    check_interval: 1s
  # Пакетная отправка: приложения шлют по одному интервалу отправки (5с метрики), а трассы и
  # журналы идут событиями. Без пакетной отправки точка приёма писала бы в хранилища на каждый
  # чих; ждать дольше секунды незачем — хранилища рядом, а задержка в трассе видна сразу.
  batch:
    timeout: 1s

exporters:
  # Метрики сборщику в текстовом формате. Это единственный источник метрик приложений и провизёра:
  # они отправляют их отправкой, а этот экспортёр держит накопленные величины в памяти и отдаёт их
  # по /metrics тому, кто их опрашивает. Срок жизни накопленного — metric_expiration.
  prometheus:
    endpoint: 0.0.0.0:9464
    # Метки области видимости у Micrometer пустые, а экспортёр по умолчанию вешает на каждый ряд
    # otel_scope_name="" otel_scope_version="" otel_scope_schema_url="": три пустые метки ряда.
    without_scope_info: true
    # Ряд, который перестал обновляться, исчезает через эти 30с (шаг отправки метрик 5с). Иначе
    # молчащий инстанс ещё долго жил бы в данных, и правило «инстанс молчит» срабатывало бы с
    # задержкой в 5 минут — умолчание точки приёма.
    metric_expiration: 30s
  # Трассы и журналы уходят по OTLP/HTTP: у хранилища трасс адрес приёма /v1/traces, у хранилища
  # журналов — свой префикс /otlp. Поэтому у обоих задан адрес сигнала целиком, а не общий endpoint.
  #
  # max_elapsed_time у обоих — обязателен, а не аккуратность. Пока хранилище недоступно, пакет,
  # который не удалось отправить, остаётся в памяти двери и повторяется с нарастающей паузой
  # (на стенде пауза доходила до 33с и выше). Такие пакеты — единственное, что растёт в памяти
  # при лежащем хранилище; без потолка ожидания дверь упирается в память и начинает отказывать
  # во всём сразу. 30с — с запасом больше времени перезапуска контейнера хранилища на стенде.
  otlp_http/tempo:
    traces_endpoint: http://tempo:4318/v1/traces
    retry_on_failure:
      max_elapsed_time: 30s
  otlp_http/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    retry_on_failure:
      max_elapsed_time: 30s

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter/metrics, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter/traces, batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter/logs, batch]
      exporters: [otlp_http/loki]