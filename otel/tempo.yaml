# Хранилище трасс стенда (Tempo). Принимает трассы по OTLP/HTTP от точки приёма (otel-collector).
#
# Хранение локальное и без тома — как у сборщика метрик: истории хватает на разбор перехода,
# а после пересоздания контейнера она теряется (docs/operations.md). Постоянное хранилище стенду
# не нужно, а тома у наблюдения не должно быть по той же причине, по которой его нет у сборщика:
# недоступность наблюдения не должна ронять стенд.
target: all

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          # Тот же порт приёма, что и у точки приёма: в сети compose адреса разные, а порт
          # один — так адрес приёма читается одинаково в обеих конфигурациях.
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_worker:
  compaction:
    # Срок хранения трасс. В Tempo 3.x срок задаётся здесь, а не в блоке compactor: отдельного
    # блока compactor в этой версии нет, и задание его привело бы к отказу на старте.
    # Час стенду хватает: трассы нужны, чтобы разобрать переход, а не чтобы хранить историю.
    block_retention: 1h
    # Сжатые блоки хранятся совсем недолго: сжатый блок уже не перезаписывается, а иначе он
    # висел бы в данных сверх срока, и проверка ограниченного хранения (docs/operations.md)
    # показывала бы растущий объём.
    compacted_block_retention: 10m