apiVersion: 1

# Источник данных для всех панелей стенда. UID зафиксирован: панели ссылаются на него по имени,
# поэтому переименование в интерфейсе панели не сломает (правки в интерфейсе всё равно запрещены).
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Панели из репозитория: правка в интерфейсе перезаписывается при перезапуске витрины.
    editable: false
    jsonData:
      httpMethod: POST
      # Шаг сбора в prometheus.yml — 5с; запросы на границах интервала считают полупустой интервал
      # и рисовали бы рваные линии.
      timeInterval: 5s
      prometheusType: Prometheus
      prometheusVersion: 3.6.0