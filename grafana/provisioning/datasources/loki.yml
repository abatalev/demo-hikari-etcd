apiVersion: 1

# Источник данных журналов: журналы приложений приходят в хранилище журналов через дверь сигналов.
# UID зафиксирован: панели и переходы ссылаются на него по имени, поэтому переименование в
# интерфейсе не сломает ссылки (правки в интерфейсе всё равно запрещены поставщиком).
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Признаки инстанса и реплики заданы в otel/loki.yaml как метки строки, поэтому журнал
      # ищется запросом вида {node="service-a-group-1-1"} без разбора текста.
      maxLines: 1000