# Конфигурация сборщика метрик стенда.
#
# Приложения стенда (инстансы сервиса и провизёр конфигурации) в списке целей НЕ значатся: они
# отправляют метрики в единую точку приёма (otel-collector), и сборщик опрашивает только её —
# одна задача сбора на всех. Молчание отдельного инстанса ловит правило отсутствия ряда
# (prometheus/rules/instances.yml), а не список целей.
#
# Прочие цели статические: имена их сервисов в compose не меняются вместе со списком инстансов.
# Своей отправки у них нет, поэтому они остаются целями опроса.
#
# Ни одно наблюдение не является условием готовности инстансов: сборщик поднимается и падает
# независимо, а проверка его состояния — отдельная команда (make targets).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  # Метрики процесса и пула меняются быстро только под нагрузкой; 5с достаточно, чтобы поймать
  # переходы пересчёта бюджета (они занимают 0.3-0.8с), и не нагружает ни процессы, ни postgres.
  external_labels:
    stand: hikari-etcd

rule_files:
  # Явно перечисленные файлы, а не *.yml: рядом лежат stand.test.yml и instances.test.yml — это
  # проверки правил promtool, а не правила. Сборщик такую попытку проглотил бы молча
  # (promtool check config — нет). Новый файл правил обязан быть в списке здесь.
  - /etc/prometheus/rules/stand.yml
  - /etc/prometheus/rules/instances.yml

scrape_configs:
  # Единственная точка сбора метрик приложений и провизёра — дверь сигналов (otel-collector).
  # Приложения отправляют метрики отправкой, а дверь отдаёт их по /metrics в текстовом формате.
  # Одна цель на всех: признаки инстанса и реплики в рядах — от самих приложений (общие теги),
  # адрес цели у всех рядов один и общий (адрес двери) и ни о ком ничего не говорит, поэтому
  # различать инстансы и реплики надо по node/service/replica, а не по адресу цели.
  # Молчание инстанса ловится правилом отсутствия ряда (prometheus/rules/instances.yml), а не
  # списком целей: список инстансов в целях сборщика был второй копией .env, которая молча
  # разъезжалась с ним (см. design.md).
  - job_name: door
    static_configs:
      - targets:
          - otel-collector:9464
    # Дверь добавляет в каждый ряд признак job из resource-признака service.name (в экспортере
    # метрик это неотключаемо: service.name → job, service.instance.id → instance). Сборщик по
    # умолчанию не доверяет пришедшим признакам (honor_labels: false), поэтому тот job
    # переименовывается в exported_job, а настоящим остаётся job="door".
    # Тот выкинутый признак ничего не говорит: значение одно на весь флот (у провизёра другое),
    # и в панелях и правилах его нет. Ряд с ним — тот самый случай «рядом с признаком цели всегда
    # получится exported_*», поэтому он снимается здесь, а не остаётся шумом во всех запросах.
    # instance сюда не попадает: service.instance.id намеренно не задаётся (см. AGENTS.md), так
    # что ряды инстансов не получают exported_instance, а адрес цели у них общий — адрес двери.
    metric_relabel_configs:
      - action: labeldrop
        regex: exported_job

  # etcd отдаёт свои штатные метрики на клиентском порту. Это не приложение стенда: сигналы
  # отправки у него нет, поэтому он остаётся отдельной целью опроса.
  - job_name: etcd
    static_configs:
      - targets:
          - etcd:2379

  # Сборщики метрик баз: сессии пулов по application_name, состояние экземпляров postgres.
  # По одному сборщику на базу (база на сервис) в одной задаче: сессии пулов различаются именем
  # приложения, поэтому ряды не склеиваются. Признак цели различает сборщики, и он попадёт в
  # легенду панели, если запрос в панели упирается до суммирования по имени приложения.
  # Порт 9187 у обоих: это порт ВНУТРИ контейнера (--web.listen-address=:9187), а различаются
  # порты на хосте — EXPORTER_PORT_A/B. Разные порты в целях означали бы молчащую цель.
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter-a:9187
          - postgres-exporter-b:9187