            отправка в точку приёма не доходит. Состав стенда: make check-instances.
      - alert: InstanceSilent
        expr: absent(pool_config_state{node="service-a-group-2-2"})
        for: 2m
        labels:
          severity: warning
          node: service-a-group-2-2
        annotations:
          summary: "Инстанс {{ $labels.node }} молчит в наблюдении"
          description: >-
            service-a/group-2/service-a-group-2-2: нет ряда pool_config_state — процесс не присылает метрики либо
            отправка в точку приёма не доходит. Состав стенда: make check-instances.
      - alert: InstanceSilent
        expr: absent(pool_config_state{node="service-b-group-1-1"})
        for: 2m
        labels:
          severity: warning
          node: service-b-group-1-1
        annotations:
          summary: "Инстанс {{ $labels.node }} молчит в наблюдении"
          description: >-
            service-b/group-1/service-b-group-1-1: нет ряда pool_config_state — процесс не присылает метрики либо
            отправка в точку приёма не доходит. Состав стенда: make check-instances.
      - alert: InstanceSilent
        expr: absent(pool_config_state{node="service-b-group-1-2"})
        for: 2m
        labels:
          severity: warning
          node: service-b-group-1-2
        annotations:
          summary: "Инстанс {{ $labels.node }} молчит в наблюдении"
          description: >-
            service-b/group-1/service-b-group-1-2: нет ряда pool_config_state — процесс не присылает метрики либо
            отправка в точку приёма не доходит. Состав стенда: make check-instances.
      - alert: InstanceSilent
        expr: absent(pool_config_state{node="service-b-group-2-1"})
        for: 2m
        labels:
          severity: warning
          node: service-b-group-2-1
        annotations:
          summary: "Инстанс {{ $labels.node }} молчит в наблюдении"
          description: >-
            service-b/group-2/service-b-group-2-1: нет ряда pool_config_state — процесс не присылает метрики либо
            отправка в точку приёма не доходит. Состав стенда: make check-instances.
      - alert: InstanceSilent
        expr: absent(pool_config_state{node="service-b-group-2-2"})
        for: 2m
        labels:
          severity: warning
          node: service-b-group-2-2
        annotations:
          summary: "Инстанс {{ $labels.node }} молчит в наблюдении"
          description: >-
            service-b/group-2/service-b-group-2-2: нет ряда pool_config_state — процесс не присылает метрики либо
            отправка в точку приёма не доходит. Состав стенда: make check-instances.
