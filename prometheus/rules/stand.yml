# Правила стенда. Проверяются promtool в make test, поэтому опечатка в выражении роняет проверку
# репозитория, а не обнаруживается через месяц.
#
# Доставки уведомлений нет: alertmanager в объём не входит, сработавшие правила видны в панели
# правил Grafana по метрике ALERTS{alertstate="firing"}.
groups:
  # --- потолок бюджета соединений ---
  # Превышение потолка — это когда флот держит в базе больше, чем бюджет. Проверяется дважды и
  # двумя независимыми способами: по учёту провизёра (сумма приказанных размеров выше бюджета —
  # ошибка в расчёте) и по правде от базы (сессий пулов сервиса больше бюджета).
  #
  # Оценка занятого места (provision_fleet_sum_held_estimate) и её максимум с последнего пересчёта
  # правилом НЕ являются: пока инстанс не подтвердил освобождение публикацией, провижёр берёт худший
  # случай — узел держит весь свой потолок сверх нового, — и оценка законно доходит до N плюс целая
  # доля. На штатном перезапуске флота это ровно то, что происходит. Максимум оценки остаётся гейджем
  # на панели: он показывает глубину худшего случая, а не нарушение.
  - name: fleet-ceiling
    rules:
      # Обе величины берутся максимумом по репликам: величины считает только ведущая, а сравнение
      # по «службе» не даёт задвоить сигнал, если в окне перехвата лидерства писали обе.
      - alert: FleetCommandsExceedBudget
        expr: >
          max by (service) (provision_fleet_sum_ceilings)
            > max by (service) (provision_fleet_budget_active)
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Сумма приказанных размеров по сервису выше бюджета"
          description: >-
            Сервис {{ $labels.service }}: сумма приказанных размеров
            {{ $value | humanize }} превысила бюджет активного флота. Потолок max_connections
            защищает базу, поэтому состояние опасное: место выдано сверх бюджета.

      # Сессии флота по данным базы: единственная величина, которой интересует потолок. Случай с
      # пересозданием пула (старое поколение дренируется, новое уже набирает соединения) даёт
      # кратковременное превышение, поэтому правило держится минуту, а не срабатывает на первом
      # же сборе.
      #
      # Сессия пула опознаётся по application_name, равному имени инстанса (POOL_NAME), а признак
      # service берётся из метрик самого инстанса: так сервис не угадывается по имени. Отбор идёт по
      # шаблону application_name — при смене соглашения об именах инстансов правится он здесь и
      # переменная $pool_app на панели «Пулы и конфигурация». Множитель на единицу нужен, чтобы
      # перенести признак service: оператор and в скобках парсер prometheus не принимает.
      #
      # База на сервис, и сессии приходят из двух сборщиков, но суммирование по application_name
      # ряды не склеивает: имя приложения уникально на весь стенд, поэтому существует ровно в
      # одном сборщике, и второму склеивать нечего. Оговорка существенная — корректность здесь
      # держится на соглашении об именах, а не на формулировке запроса. При одинаковых именах
      # инстансов у двух сервисов в разных базах сумма сложила бы два пула в один ряд и флот
      # посчитался бы неверно, а правило промолчало бы. Нарушение соглашения ловится на глаз по
      # make sessions S=<сервис>: в базе должны быть сессии только инстансов этого сервиса.
      - alert: FleetConnectionsExceedBudget
        expr: |
          sum by (service) (
            label_replace(
              sum by (application_name) (pg_stat_activity_count{application_name=~"service-.+"}),
              "node", "$1", "application_name", "(.+)"
            )
            * on(node) group_left(service) count by (node, service) (pool_maximum_pool_size)
          ) > max by (service) (provision_fleet_budget_active)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Флот держит в базе больше соединений, чем бюджет"
          description: >-
            Сервис {{ $labels.service }}: пулы занимают {{ $value | humanize }} соединений при бюджете
            активного флота меньше. Потолок max_connections пробит на деле: либо провизёр отдал место
            без освобождения, либо соединения держит неучтённый владелец.

  # --- переходы бюджета ---
  - name: fleet-transitions
    rules:
      - alert: FleetNodesWithoutShareWhileRoomFree
        expr: >-
          provision_fleet_nodes_without_share > 0
            and provision_fleet_growable_free > 0
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: "Инстансы без доли при свободном месте"
          description: >-
            Сервис {{ $labels.service }}: {{ $value | humanize }} узлов ждут доли, хотя место для
            роста есть. Инстанс без доли не обслуживает трафик (503, readiness DOWN), поэтому
            свободное место при нём означает ошибку расчёта роста.

      # Текущее число узлов, у которых подтверждённое сжатие не уменьшается дольше порога, а не
      # счётчик предупреждений: по счётчику правило держалось бы сработавшим ещё 15 минут после
      # того, как сжатие освободилось, и кричало бы на каждом штатном перезапуске флота, где
      # публикаций нет ни у кого и сжимать нечего.
      - alert: FleetStuckShrink
        expr: max by (service) (provision_fleet_stuck_shrink_nodes) > 0
        labels:
          severity: warning
        annotations:
          summary: "Неосвобождённое сжатие держится дольше порога"
          description: >-
            Сервис {{ $labels.service }}: у {{ $value | humanize }} узлов подтверждённое сжатие не
            уменьшается дольше порога. Место не перераспределяется, флот работает меньше бюджета —
            это безопасно, но трафик распределён хуже, чем мог бы быть.

  # --- доступность наблюдения и трафика ---
  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Цель сбора метрик недоступна"
          description: >-
            Сборщик не достаёт до цели {{ $labels.instance }} (задача {{ $labels.job }}) дольше
            двух минут. Метрики этой цели в графиках и правилах отсутствуют.

      - alert: TargetMissing
        expr: absent(up)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Сборщик не видит ни одной цели"
          description: >-
            Задача {{ $labels.job }} не отдала ни одного ряда up. Обычно это пустой список целей
            (file_sd) или сборщик ещё не поднялся.