name: hikari-etcd-stand

# Образ с etcdctl для ручных правок конфигурации из Makefile (make config / set-size и т.п.).
x-etcdctl: &etcdctl
  image: hikari-etcd/etcdctl:local
  build: ./etcd
  environment:
    ETCDCTL_ENDPOINTS: http://etcd:2379
    ETCDCTL_API: "3"

# Общий блок инстанса сервиса. Восемь копий отличаются SERVICE_NAME/ETCD_GROUP/ETCD_INSTANCE
# (сегменты пути конфигурации), POOL_NAME (иначе pool_sessions склеит пулы) и портом хоста.
# Канонический список инстансов с портами — ETCD_INSTANCES в .env (см. make instances).
x-service: &service
  image: hikari-etcd/service:local
  build: ./service
  mem_limit: 512m
  depends_on:
    postgres:
      condition: service_healthy
  environment: &service-env
    DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-demo}
    DB_USER: ${POSTGRES_USER:-app}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
    POOL_MAX_SIZE: ${POOL_MAX_SIZE:-10}
    # true = после расширения пула сразу открыть нужное число коннектов (демо).
    # false = как в проде: коннекты добираются по мере надобности.
    POOL_EAGER_FILL: ${POOL_EAGER_FILL:-true}
    # сколько ждать активные соединения при пересоздании пула (смена jdbcUrl/кредов)
    POOL_DRAIN_TIMEOUT: ${POOL_DRAIN_TIMEOUT:-3s}
    ETCD_ENDPOINTS: http://etcd:2379
    ETCD_ROOT: ${ETCD_ROOT:-/config}
  healthcheck:
    # Готовность (гейт конфигурации), а не общий health: живость от etcd не зависит.
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    start_period: 90s
    retries: 60

# Общий блок провизинера конфигурации (две реплики). Работает один на сервис: лидер выбирается
# узлами {root}/provisioner/leader/{service}/, набор сервисов провизор выводит сам из узлов
# регистрации дерева {root}/services/. Ключи кладутся атомарно и только если их ещё нет (txn
# «ключа нет → put»): ручные правки оператора не затираются ни одной из реплик.
x-provisioner: &provisioner
  image: hikari-etcd/config-provisioner:local
  build: ./provisioner
  mem_limit: 512m
  depends_on:
    etcd:
      condition: service_healthy
  environment: &provisioner-env
    PROV_ETCD_ENDPOINTS: http://etcd:2379
    PROV_ETCD_ROOT: ${ETCD_ROOT:-/config}
    PROV_MAX_POOL_SIZE: ${PROV_MAX_POOL_SIZE:-10}
    PROV_CONNECTION_TIMEOUT_MS: ${PROV_CONNECTION_TIMEOUT_MS:-3000}
    PROV_LEADER_TTL: ${PROV_LEADER_TTL:-10s}
  healthcheck:
    # Живость — только ping: провижининг переживает обрывы etcd сам.
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    retries: 60

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-demo}"]
      interval: 3s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.6.15
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-token=hikari-etcd-stand
      - --initial-cluster-state=new
      - --log-level=warn
    ports:
      - "${ETCD_PORT:-2379}:2379"
      - "${ETCD_PEER_PORT:-2380}:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Провижинер конфигурации, две реплики. Работает один на сервис (выборы лидера по
  # {root}/provisioner/leader/{service}/): появление узла регистрации инстанса -> в его путь
  # кладутся отсутствующие стартовые ключи hikari/*, исчезновение узла -> весь префикс удаляется.
  config-provisioner-1:
    <<: *provisioner
    environment:
      <<: *provisioner-env
      PROV_NAME: provisioner-1

  config-provisioner-2:
    <<: *provisioner
    environment:
      <<: *provisioner-env
      PROV_NAME: provisioner-2

  # --- инстансы service-a (группы group-1, group-2) ---
  service-a-group-1-1:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-a-group-1-1
      POOL_NAME: service-a-group-1-1
    ports:
      - "18081:8080"

  service-a-group-1-2:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-a-group-1-2
      POOL_NAME: service-a-group-1-2
    ports:
      - "18082:8080"

  service-a-group-2-1:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-a-group-2-1
      POOL_NAME: service-a-group-2-1
    ports:
      - "18083:8080"

  service-a-group-2-2:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-a-group-2-2
      POOL_NAME: service-a-group-2-2
    ports:
      - "18084:8080"

  # --- инстансы service-b (группы group-1, group-2) ---
  service-b-group-1-1:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-b-group-1-1
      POOL_NAME: service-b-group-1-1
    ports:
      - "18085:8080"

  service-b-group-1-2:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-b-group-1-2
      POOL_NAME: service-b-group-1-2
    ports:
      - "18086:8080"

  service-b-group-2-1:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-b-group-2-1
      POOL_NAME: service-b-group-2-1
    ports:
      - "18087:8080"

  service-b-group-2-2:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-b-group-2-2
      POOL_NAME: service-b-group-2-2
    ports:
      - "18088:8080"

  # --- балансировка входящего трафика: граница по сервису (lb-a -> service-a, lb-b -> service-b) ---
  lb-a:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/lb.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_1: service-a-group-1-1:8080
      BACKEND_2: service-a-group-1-2:8080
      BACKEND_3: service-a-group-2-1:8080
      BACKEND_4: service-a-group-2-2:8080
    ports:
      - "${LB_A_PORT:-8080}:80"
    # nginx резолвит имена бэкендов при старте и умирает, если DNS-имя ещё не существует:
    # стартуем только после того, как все четыре инстанса прошли readiness-healthcheck.
    depends_on:
      service-a-group-1-1:
        condition: service_healthy
      service-a-group-1-2:
        condition: service_healthy
      service-a-group-2-1:
        condition: service_healthy
      service-a-group-2-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  lb-b:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/lb.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_1: service-b-group-1-1:8080
      BACKEND_2: service-b-group-1-2:8080
      BACKEND_3: service-b-group-2-1:8080
      BACKEND_4: service-b-group-2-2:8080
    ports:
      - "${LB_B_PORT:-8081}:80"
    depends_on:
      service-b-group-1-1:
        condition: service_healthy
      service-b-group-1-2:
        condition: service_healthy
      service-b-group-2-1:
        condition: service_healthy
      service-b-group-2-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  loadgen:
    build: ./loadgen
    depends_on:
      service-a-group-1-1:
        condition: service_healthy
    environment:
      # TARGET — через балансировщик; STATUS_TARGET — стабильный инстанс для сводки пула
      TARGET: http://lb-a
      STATUS_TARGET: http://service-a-group-1-1:8080
      WORKERS: ${WORKERS:-4}
      WORK_MS: ${WORK_MS:-25}
      THINK_MS: ${THINK_MS:-0}
      REPORT_MS: ${REPORT_MS:-2000}
      DURATION_S: ${DURATION_S:-0}
    restart: unless-stopped

  # Инструмент для ручной работы с конфигом: make config / make set-size N
  etcdctl:
    <<: *etcdctl
    entrypoint: ["etcdctl"]
    depends_on:
      etcd:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pg-data:
  etcd-data: