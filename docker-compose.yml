name: hikari-etcd-stand

# Схема стенда: база на сервис, балансировщик и точка нагрузки на сервис, сборщик метрик на базу.
# Восемь инстансов (по четыре на сервис) делят один etcd с бюджетами, но у каждого сервиса своя
# база, свой потолок соединений и своя изоляция при отказе. Механизму разделение безразлично:
# бюджет и доли живут в etcd, адрес базы приходит локально в DB_URL.

# Образ с etcdctl для ручных правок конфигурации из Makefile (make config / set-size и т.п.).
x-etcdctl: &etcdctl
  image: hikari-etcd/etcdctl:local
  build: ./etcd
  environment:
    ETCDCTL_ENDPOINTS: http://etcd:2379
    ETCDCTL_API: "3"

# Общая часть инстанса сервиса, одинаковая для обоих сервисов. Восемь копий отличаются
# SERVICE_NAME/ETCD_GROUP/ETCD_INSTANCE (сегменты пути конфигурации), POOL_NAME (иначе
# pool_sessions склеит пулы) и портом хоста. Канонический список инстансов с портами —
# ETCD_INSTANCES в .env (см. make instances).
x-service: &service-base
  image: hikari-etcd/service:local
  build: ./service
  mem_limit: 512m
  environment: &service-env
    DB_USER: ${POSTGRES_USER:-app}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
    # Размер пула задаётся только etcd: локальный дефолт максимума жёстко 0 (пула нет до
    # первого конфига провижера), POOL_MAX_SIZE больше нет.
    # true = после расширения пула сразу открыть нужное число коннектов (демо).
    # false = как в проде: коннекты добираются по мере надобности.
    POOL_EAGER_FILL: ${POOL_EAGER_FILL:-true}
    # сколько ждать активные соединения при пересоздании пула (смена jdbcUrl/кредов)
    POOL_DRAIN_TIMEOUT: ${POOL_DRAIN_TIMEOUT:-3s}
    ETCD_ENDPOINTS: http://etcd:2379
    ETCD_ROOT: ${ETCD_ROOT:-/config}
    # Доля запросов, попадающих в трассу: 1.0 — всё (стенд и разбор перехода), меньше — меньше
    # помехи под долгой нагрузкой. События механизма отбираются всегда, независимо от доли.
    OTEL_TRACES_SAMPLING: ${OTEL_TRACES_SAMPLING:-1.0}
    # Адреса точки приёма сигналов. По умолчанию дверь стенда; переопределение нужно, чтобы
    # проверить, что отправка не влияет на пул и трафик (сценарий «точка приёма недоступна»).
    OTEL_METRICS_URL: ${OTEL_METRICS_URL:-http://otel-collector:4318/v1/metrics}
    OTEL_TRACES_URL: ${OTEL_TRACES_URL:-http://otel-collector:4318/v1/traces}
    OTEL_LOGS_URL: ${OTEL_LOGS_URL:-http://otel-collector:4318/v1/logs}
  healthcheck:
    # Готовность (гейт конфигурации), а не общий health: живость от etcd не зависит.
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    start_period: 90s
    retries: 60

# Часть инстанса, различающаяся по сервису: ровно два свойства — адрес базы и условие готовности,
# по которому инстанс дожидается своей базы. Всё остальное общее. Разделение здесь, а не в восьми
# блоках инстансов, гарантирует, что у инстанса не может оказаться база чужого сервиса.
x-service-a: &service-a
  <<: *service-base
  depends_on:
    postgres-a:
      condition: service_healthy
  environment: &service-a-env
    <<: *service-env
    DB_URL: jdbc:postgresql://postgres-a:5432/${POSTGRES_DB:-demo}

x-service-b: &service-b
  <<: *service-base
  depends_on:
    postgres-b:
      condition: service_healthy
  environment: &service-b-env
    <<: *service-env
    DB_URL: jdbc:postgresql://postgres-b:5432/${POSTGRES_DB:-demo}

# Общий блок провизинера конфигурации (две реплики). Работает один на сервис: лидер выбирается
# узлами {root}/provisioner/leader/{service}/, набор сервисов провизор выводит сам из узлов
# регистрации дерева {root}/services/. Ключи кладутся атомарно и только если их ещё нет (txn
# «ключа нет → put»): ручные правки оператора не затираются ни одной из реплик.
x-provisioner: &provisioner
  image: hikari-etcd/config-provisioner:local
  build: ./provisioner
  mem_limit: 512m
  depends_on:
    etcd:
      condition: service_healthy
  environment: &provisioner-env
    PROV_ETCD_ENDPOINTS: http://etcd:2379
    PROV_ETCD_ROOT: ${ETCD_ROOT:-/config}
    PROV_ACTIVE_MAX_CONNECTIONS: ${PROV_ACTIVE_MAX_CONNECTIONS:-100}
    PROV_ACTIVE_MIN_CONNECTIONS: ${PROV_ACTIVE_MIN_CONNECTIONS:-1}
    PROV_INACTIVE_MAX_CONNECTIONS: ${PROV_INACTIVE_MAX_CONNECTIONS:-1}
    PROV_MAX_SHARE: ${PROV_MAX_SHARE:-200}
    PROV_CONNECTION_TIMEOUT_MS: ${PROV_CONNECTION_TIMEOUT_MS:-3000}
    PROV_LEADER_TTL: ${PROV_LEADER_TTL:-10s}
    # Доля запросов, попадающих в трассу: 1.0 — всё, меньше — меньше помехи.
    OTEL_TRACES_SAMPLING: ${OTEL_TRACES_SAMPLING:-1.0}
    # Адреса точки приёма сигналов: по умолчанию дверь стенда, переопределение — для проверки
    # «наблюдение недоступно, провижининг работает».
    OTEL_METRICS_URL: ${OTEL_METRICS_URL:-http://otel-collector:4318/v1/metrics}
    OTEL_TRACES_URL: ${OTEL_TRACES_URL:-http://otel-collector:4318/v1/traces}
    OTEL_LOGS_URL: ${OTEL_LOGS_URL:-http://otel-collector:4318/v1/logs}
  healthcheck:
    # Живость — только ping: провижининг переживает обрывы etcd сам.
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    retries: 60

# База на каждый сервис: своя база — своя фидельность микросервису, свой потолок соединений и
# своя изоляция при отказе. Механизму база безразлична: адрес приходит локально из DB_URL, бюджет
# и доли живут в etcd, поэтому разделение — свойство обвязки стенда, а не поведения механизма.
#
# Потолок 120 = бюджет активного флота 100 + запас 20. Число выведено из двух ограничений
# сразу, и оба важны:
#   запас МЕНЬШЕ доли (100/4 = 25) — тогда превышение сверх потолка отказывает база, а поломку
#     порядка выдачи мест (она стоит одну долю) ловит сама база, а не только правило по метрике;
#   запас БОЛЬШЕ того, что занимает стенд сам (7-9 соединений) — иначе psql оператора и сборщик
#     метрик начинали бы конкурировать с флотом, и отказ служебной сессии выглядел бы как поломка
#     механизма. 20 против 8-9 оставляет 11-12 мест.
# 10 не годится (ложные тревоги), 50 делает потолок декоративным. Роль стенда — суперпользователь,
# поэтому зарезервированные слоты не занимаются флотом: сборщик и psql проходят даже при отказе.
x-postgres: &postgres
  image: postgres:16
  environment:
    POSTGRES_DB: ${POSTGRES_DB:-demo}
    POSTGRES_USER: ${POSTGRES_USER:-app}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
  command:
    - postgres
    - -c
    - max_connections=${POSTGRES_MAX_CONNECTIONS:-120}
    - -c
    - log_min_duration_statement=500
  volumes:
    - ./db/init:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-demo}"]
    interval: 3s
    timeout: 3s
    retries: 20

x-exporter: &exporter
  image: prometheuscommunity/postgres-exporter:v0.20.1
  mem_limit: 256m
  command:
    - --collector.stat_activity
    - --collector.stat_activity_autovacuum
    - --web.listen-address=:9187
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9187/metrics"]
    interval: 10s
    timeout: 5s
    start_period: 20s
    retries: 20

x-loadgen: &loadgen
  build: ./loadgen
  environment: &loadgen-env
    WORKERS: ${WORKERS:-4}
    WORK_MS: ${WORK_MS:-25}
    THINK_MS: ${THINK_MS:-0}
    REPORT_MS: ${REPORT_MS:-2000}
    DURATION_S: ${DURATION_S:-0}
  restart: unless-stopped

services:
  postgres-a:
    <<: *postgres
    ports:
      - "${POSTGRES_PORT_A:-5432}:5432"
    volumes:
      - pg-data-a:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  postgres-b:
    <<: *postgres
    ports:
      - "${POSTGRES_PORT_B:-5433}:5432"
    volumes:
      - pg-data-b:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  etcd:
    image: quay.io/coreos/etcd:v3.6.15
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-token=hikari-etcd-stand
      - --initial-cluster-state=new
      - --log-level=warn
    ports:
      - "${ETCD_PORT:-2379}:2379"
      - "${ETCD_PEER_PORT:-2380}:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Провижинер конфигурации, две реплики. Работает один на сервис (выборы лидера по
  # {root}/provisioner/leader/{service}/): появление узла регистрации инстанса -> в его путь
  # кладутся отсутствующие стартовые ключи hikari/*, исчезновение узла -> весь префикс удаляется.
  config-provisioner-1:
    <<: *provisioner
    environment:
      <<: *provisioner-env
      PROV_NAME: provisioner-1

  config-provisioner-2:
    <<: *provisioner
    environment:
      <<: *provisioner-env
      PROV_NAME: provisioner-2

  # --- инстансы service-a (группы group-1, group-2) ---
  service-a-group-1-1:
    <<: *service-a
    environment:
      <<: *service-a-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-a-group-1-1
      POOL_NAME: service-a-group-1-1
    ports:
      - "18081:8080"

  service-a-group-1-2:
    <<: *service-a
    environment:
      <<: *service-a-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-a-group-1-2
      POOL_NAME: service-a-group-1-2
    ports:
      - "18082:8080"

  service-a-group-2-1:
    <<: *service-a
    environment:
      <<: *service-a-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-a-group-2-1
      POOL_NAME: service-a-group-2-1
    ports:
      - "18083:8080"

  service-a-group-2-2:
    <<: *service-a
    environment:
      <<: *service-a-env
      SERVICE_NAME: service-a
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-a-group-2-2
      POOL_NAME: service-a-group-2-2
    ports:
      - "18084:8080"

  # --- инстансы service-b (группы group-1, group-2) ---
  service-b-group-1-1:
    <<: *service-b
    environment:
      <<: *service-b-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-b-group-1-1
      POOL_NAME: service-b-group-1-1
    ports:
      - "18085:8080"

  service-b-group-1-2:
    <<: *service-b
    environment:
      <<: *service-b-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-1
      ETCD_INSTANCE: service-b-group-1-2
      POOL_NAME: service-b-group-1-2
    ports:
      - "18086:8080"

  service-b-group-2-1:
    <<: *service-b
    environment:
      <<: *service-b-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-b-group-2-1
      POOL_NAME: service-b-group-2-1
    ports:
      - "18087:8080"

  service-b-group-2-2:
    <<: *service-b
    environment:
      <<: *service-b-env
      SERVICE_NAME: service-b
      ETCD_GROUP: group-2
      ETCD_INSTANCE: service-b-group-2-2
      POOL_NAME: service-b-group-2-2
    ports:
      - "18088:8080"

  # --- балансировка входящего трафика: одна точка входа на сервис (web-a -> service-a, web-b -> service-b) ---
  #
  # Список бэкендов НЕ перечислен здесь, а лежит в traefik/dynamic/fleet.yml и выводится из
  # ETCD_INSTANCES командой make balancers (make up вызывает её перед стартом, make check-balancers
  # сверяет, обе — в make test). Копия списка инстансов, написанная руками, разъезжалась бы с .env
  # молча: nginx резолвил такие адреса один раз при старте и после пересоздания инстансов
  # продолжал слать запросы по старым.
  #
  # Процесс один, точек входа две: web-a обслуживает только service-a, web-b — только service-b.
  # Отдельные процессы ничего не добавляли — у lb-a и lb-b составы бэкендов не пересекались,
  # поэтому падение одного не отправляло трафик в другой, а просто оставляло сервис без входа.
  # depends_on на инстансы НЕ нужен: адрес, которого ещё нет, Traefik переносит и подхватывает
  # сам, когда инстанс появится, поэтому ждать готовности всех восьми не требуется.
  lb:
    image: traefik:v3.5
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Каталогом, а не файлом: слежение за файлом при смонтированном файле не работает — ядро не
      # доставляет события файловой системы внутрь контейнера по файловому bind-mount, и перечитывание
      # не наступает никогда. Проверено: правка fleet.yml на месте (и заменой файла, и записью поверх)
      # не меняла маршруты, пока каталог не смонтирован целиком.
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    command: ["--configFile=/etc/traefik/traefik.yml"]
    mem_limit: 256m
    ports:
      - "${LB_A_PORT:-8080}:80"
      - "${LB_B_PORT:-8081}:81"
    # /ping — живость самого распределителя. Готовность к маршрутизации им не проверяется:
    # /ping отвечает 200 и при нуле бэкендов, а ждать надо именно маршрут (scripts/wait-ready.sh).
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Нагрузка на каждую базу: своя точка на свою точку входа балансировщика. Две реплики вместо
  # списка целей в одной — намеренно: у каждой своя гистограмма задержек и своя строка итога, и
  # отчёты двух прогонов не смешивают две базы (LoadGen.java при этом не меняется).
  # TARGET адресует балансировщик по порту: 80 обслуживает service-a, 81 — service-b.
  loadgen-a:
    <<: *loadgen
    depends_on:
      service-a-group-1-1:
        condition: service_healthy
    environment:
      <<: *loadgen-env
      # TARGET — через балансировщик; STATUS_TARGET — стабильный инстанс для сводки пула
      TARGET: http://lb:80
      STATUS_TARGET: http://service-a-group-1-1:8080

  loadgen-b:
    <<: *loadgen
    depends_on:
      service-b-group-1-1:
        condition: service_healthy
    environment:
      <<: *loadgen-env
      TARGET: http://lb:81
      STATUS_TARGET: http://service-b-group-1-1:8080

  # --- наблюдение: единая дверь сигналов и её хранилища, сборщик метрик, сборщик метрик базы,
  # витрина ---
  # Ни один из них не входит ни в одну цепочку depends_on: недоступность наблюдения не должна мешать
  # ни подъёму стенда, ни обслуживанию трафика. Состояние целей — отдельная проверка (make targets).
  #
  # Дверь и хранилища образов без оболочки (distroless), поэтому healthcheck у них не задаётся:
  # в образе нет ни wget, ни curl, а проверка готовности идёт снаружи, с хоста
  # (scripts/wait-ready.sh: 9464/metrics у двери, /ready у хранилищ) и не влияет на код возврата.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    # Потолок двери: приложения шлют метрики раз в 5с, трассы и журналы — событиями; под нагрузкой
    # стенда (32 потока нагрузчика на сервис) она держится в десятках мегабайт. 256m — с запасом.
    mem_limit: 256m
    environment:
      # Рекомендация точки приёма: сборщик мусора Go должен знать потолок заранее, иначе он
      # держит кучу на пределе и упрётся в cgroup раньше, чем сработает ограничитель памяти.
      # 80% жёсткого потолка ограничителя (192 МиБ, см. otel/collector.yaml).
      GOMEMLIMIT: 153MiB
    command:
      - --config=/etc/otel/collector.yaml
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      # Приём сигналов приложений (4318) и текстовая точка метрик двери (9464) — её опрашивает
      # сборщик, а по 9464 видно состояние двери и без сборщика (docker compose ps, curl).
      - "${OTLP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-9464}:9464"

  # Хранилище трасс. Тома нет намеренно (см. otel/tempo.yaml): история нужна на разбор перехода,
  # а не как постоянное хранилище.
  #
  # Лимит памяти 1 ГиБ, а не 512 МиБ, измерено: при 100% отборе трасс и нагрузке стенда 512 МиБ
  # не хватало — контейнер был убит по памяти (ExitCode 137, OOMKilled) через 23 часа работы, и
  # хранилище молчало, пока дверь копила неотправленные трассы и не начала отказывать в метриках
  # всего флота. GOMEMLIMIT ниже лимита — чтобы Go собрал мусор сам, до того как это сделает
  # docker: иначе смерть контейнера выглядит как падение двери.
  tempo:
    image: grafana/tempo:3.1.0
    mem_limit: 1g
    environment:
      GOMEMLIMIT: 768MiB
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      # 3200 — API хранилища трасс: /ready, поиск по признакам, разбор трассы вручную.
      - "${TEMPO_PORT:-3200}:3200"

  # Хранилище журналов. Тома нет намеренно (см. otel/loki.yaml).
  loki:
    image: grafana/loki:3.7.8
    mem_limit: 512m
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./otel/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      # 3100 — API хранилища журналов: /ready, список меток, запросы по инстансу.
      - "${LOKI_PORT:-3100}:3100"

  prometheus:
    image: prom/prometheus:v3.6.0
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Стенду хватает окна в пару часов: нужна история переходов для разбора, а не хранилище.
      # Постоянного тома нет намеренно — после перезапуска история теряется (см. docs/operations.md).
      - --storage.tsdb.retention.time=2h
    volumes:
      # Конфигурация и правила лежат в репозитории; правила молчания инстанса перегенерирует
      # make silence-rules из ETCD_INSTANCES. Каталог целиком: пути в конфигурации совпадают с
      # путями в репозитории, поэтому правила не надо перечислять поимённо.
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "${PROM_PORT:-9090}:9090"
    healthcheck:
      # /-/ready: сборщик отвечает, когда он действительно готов принимать цели, а не просто запущен.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  # Сборщик метрик базы: сессии пулов по application_name, состояние экземпляра postgres.
  # По одному сборщику на базу: sessions пулов попадают в сборщик своей базы, и сводка по имени
  # приложения не дублирует ряды, потому что имя приложения (POOL_NAME) уникально на стенд.
  # Подключается существующим суперпользователем стенда (POSTGRES_USER — он суперпользователь,
  # поэтому видны сессии всех инстансов, а зарезервированные слоты не занимаются флотом).
  # Отдельная роль с pg_monitor для боевого контура.
  postgres-exporter-a:
    <<: *exporter
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres-a:5432/${POSTGRES_DB:-demo}?sslmode=disable
      # Сессии пулов нужны как основной показатель «кто сколько держит», поэтому сборщик явно
      # включён, а не полагается на значение по умолчанию образа.
      PG_EXPORTER_COLLECTOR_STAT_ACTIVITY: "true"
    ports:
      - "${EXPORTER_PORT_A:-9187}:9187"

  postgres-exporter-b:
    <<: *exporter
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres-b:5432/${POSTGRES_DB:-demo}?sslmode=disable
      PG_EXPORTER_COLLECTOR_STAT_ACTIVITY: "true"
    ports:
      - "${EXPORTER_PORT_B:-9188}:9187"

  # Витрина метрик: источник данных и панели поставляются из репозитория, правки в интерфейсе
  # перезаписываются при перезапуске (поставщик панелей запрещает сохранение).
  grafana:
    image: grafana/grafana:13.1.1
    # Потолок витрины вдвое больше прежних 512m, при которых её убивал OOM: Grafana 13
    # держит в памяти ещё и подпроцессы встроенных плагинов. Замер cgroup за 18 часов работы
    # вместе с прогонами нагрузки: пик 728.6 МиБ, сейчас 322 МиБ — 1536m даёт запас вдвое.
    # Пересчитывать по замеру, а не на глаз: docker stats, затем
    #   cat /sys/fs/cgroup/system.slice/docker-<id>.scope/memory.peak
    mem_limit: 1536m
    environment:
      # Анонимный просмотр без логина: стенд локальный, а логин только мешает смотреть графики.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  # Инструмент для ручной работы с конфигом: make config / make set-size N
  etcdctl:
    <<: *etcdctl
    entrypoint: ["etcdctl"]
    depends_on:
      etcd:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pg-data-a:
  pg-data-b:
  etcd-data:
