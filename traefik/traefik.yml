# Статическая конфигурация Traefik (распределителя стенда).
# Динамическая часть — роутеры и сервисы состава — в метках на контейнерах инстансов
# (docker-compose.yml, x-service-a/x-service-b), которые провайдер docker читает через
# /var/run/docker.sock (смонтирован в compose только на чтение). Списка бэкендов в файлах
# больше нет: что развёрнуто — то и балансируется, и правка состава (make up --scale)
# подхватывается по событиям docker без перезапуска распределителя.
#
# Один процесс, две точки входа — по одной на сервис. Отдельные процессы ради
# отказоустойчивости тут не нужны и не давались: lb-a и lb-b никогда не подстраховывали друг
# друга, потому что у них непересекающиеся составы бэкендов, — падение lb-a не отправляло
# трафик в lb-b, а просто оставляло service-a без входа. Границу по сервису держит привязка
# маршрута к точке входа, а не отдельный контейнер: web-a обслуживает только service-a,
# web-b — только service-b.

global:
  # Проект не обращается к внешним сервисам за версией и не отправляет анонимную статистику:
  # стенд поднимается на машине, где исходящей сети может не быть вовсе, а лишний запрос
  # от демо-окружения — это утечка наружу без спроса.
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  # Наружу, по одной на сервис. Номера портов внутри контейнера — 80 и 81, а наружу публикуются
  # LB_A_PORT и LB_B_PORT; имена точек (web-a, web-b) выводятся из имён сервисов и на них же
  # ссылаются метки Traefik в compose (traefik.http.routers.fleet-service-a.entrypoints).
  web-a:
    address: ":80"
  web-b:
    address: ":81"
  # Служебная: только /ping, наружу не публикуется.
  ping:
    address: ":8081"

api: {}

# /ping — признак живости самого распределителя: отвечает 200 всегда, в том числе когда
# бэкендов ещё нет. Готовности к маршрутизации он не проверяет — для этого scripts/wait-ready.sh
# шлёт запрос через распределитель. Смешивать эти два смысла в одном healthcheck нельзя: тогда
# распределитель с нулём бэкендов объявился бы негодным.
# Секция верхнего уровня, а не providers.ping: в Traefik v3 провайдера ping нет, и такой блок
# приводит к отказу на старте с «field not found, node: ping».
ping:
  entryPoint: ping

providers:
  docker:
    # Только чтение сокета: провайдеру нужно видеть контейнеры и их метки, управлять docker
    # он не должен. Смонтирован в compose как /var/run/docker.sock:ro.
    endpoint: unix:///var/run/docker.sock
    # Не выставлять всё подряд: наружу идёт только то, что явно помечено traefik.enable=true
    # (метки на блоках x-service-a/x-service-b).
    exposedByDefault: false
    # Следить за контейнерами: появление реплики (make up --scale) подхватывается без
    # перезапуска распределителя.
    watch: true

# Таймауты перенесены из nginx явно: дефолты Traefik заметно больше (dialTimeout 30с), и висящее
# соединение держалось бы вчетверо дольше прежнего. responseHeaderTimeout ограничивает время до
# заголовков ответа — ближайший аналог proxy_read_timeout, но не тождество: nginx-овский ограничивал
# паузу между чтениями, этот — до первого ответа. Для коротких запросов нагрузки разницы не видно,
# при зависшем на теле ответе Traefik откажет раньше.
serversTransport:
  forwardingTimeouts:
    dialTimeout: 2s
    responseHeaderTimeout: 30s