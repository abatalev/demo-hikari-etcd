server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pool-service
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # Пробы регистрируют индикаторы readinessState/livenessState, без которых
      # группа readiness не сможет включить readinessState (валидация упадёт на старте).
      probes:
        enabled: true
      group:
        # Готовность: гейт конфигурации (readinessState + poolEtcd) и доступность базы.
        # Живость — только ping: процесс жив независимо от etcd и базы.
        readiness:
          include: readinessState,db,poolEtcd
        liveness:
          include: ping

# Дефолты приложения. Размер пула (maximumPoolSize) задаётся ТОЛЬКО etcd-конфигурацией провижера:
# локальный дефолт жёстко 0, пул не создаётся, пока не пришёл первый конфиг. Остальные параметры
# можно переопределить в etcd (стартовые ключи нового инстанса кладёт config-provisioner) — etcd
# всегда выигрывает.
pool:
  db:
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/demo}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    pool-name: ${POOL_NAME:pool-service}
    maximum-pool-size: 0
    connection-timeout-ms: ${POOL_CONNECTION_TIMEOUT_MS:30000}
    idle-timeout-ms: ${POOL_IDLE_TIMEOUT_MS:600000}
    max-lifetime-ms: ${POOL_MAX_LIFETIME_MS:1800000}
    validation-timeout-ms: ${POOL_VALIDATION_TIMEOUT_MS:5000}
    leak-detection-threshold-ms: ${POOL_LEAK_DETECTION_MS:0}
    # minimum-idle намеренно не задан: null = "держи minimumIdle == maximumPoolSize"
    # (как в HikariCP по умолчанию). Зафиксировать можно в etcd ключом minimumIdle.
    initialization-fail-timeout-ms: -1
    eager-fill-on-resize: ${POOL_EAGER_FILL:true}
    # Сколько ждать активные соединения перед закрытием старого пула (при смене jdbcUrl/кредов)
    drain-on-recreate-timeout: ${POOL_DRAIN_TIMEOUT:3s}
    register-mbeans: true
  etcd:
    enabled: ${ETCD_ENABLED:true}
    endpoints: ${ETCD_ENDPOINTS:http://localhost:2379}
    # Путь ключей: {root}/services/{service}/groups/{group}/instances/{instance}/hikari/.
    # group/instance — обязательные сегменты при enabled=true: задаются ETCD_GROUP/ETCD_INSTANCE
    # либо POD_NAMESPACE/POD_NAME.
    root: ${ETCD_ROOT:/config}
    service: ${SERVICE_NAME:${spring.application.name}}
    group: ${ETCD_GROUP:${POD_NAMESPACE:}}
    instance: ${ETCD_INSTANCE:${POD_NAME:}}
    call-timeout: ${ETCD_CALL_TIMEOUT:5s}
    retry-initial-backoff: ${ETCD_RETRY_INITIAL:1s}
    retry-max-backoff: ${ETCD_RETRY_MAX:30s}
    # TTL аренды узла регистрации инстанса; keepalive идёт каждые TTL/3.
    registration-ttl: ${ETCD_REGISTRATION_TTL:15s}

logging:
  level:
    com.example.poolsvc: INFO
    com.zaxxer.hikari: INFO
    io.etcd.jetcd: WARN
