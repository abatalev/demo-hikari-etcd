server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pool-service
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Единая точка приёма сигналов: журналы, трассы и метрики уходят в otel-collector, который
  # отдаёт метрики сборщику в текстовом формате и кладёт трассы в Tempo, журналы — в Loki.
  # Текстовая точка /actuator/prometheus остаётся для человека (make pool, разбор вручную).
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URL:http://otel-collector:4318/v1/metrics}
        # Отправка раз в 5с: столько же, сколько сборщик опрашивал инстанс, — величины в панелях
        # и правилах не меняются по сравнению с опросом.
        step: ${OTEL_METRICS_STEP:5s}
        # Явные границы распределения, а не экспоненциальные: та же гистограмма, что отдаёт
        # текстовая точка, поэтому перцентили в панелях считаются по ней (_bucket).
        histogram-flavor: explicit_bucket_histogram
        # Единица времени в секундах, а не в миллисекундах (умолчание отправки): тогда имя
        # прибора в тексте получается тем же, что и на текстовой точке (…_seconds), и ни один
        # запрос в панелях и правилах не приходится переписывать при переходе на точку приёма.
        base-time-unit: seconds
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://otel-collector:4318/v1/traces}
    logging:
      endpoint: ${OTEL_LOGS_URL:http://otel-collector:4318/v1/logs}
  tracing:
    sampling:
      # Доля сигналов, которые попадают в трассу: на стенде смотреть всё, но помеха
      # настраивается — под долгой нагрузкой полная трассировка дорога. Доля общая:
      # события механизма (применение конфигурации, дренаж, публикация долга) отбираются ею же,
      # отдельного трассировщика «всегда» больше нет.
      probability: ${OTEL_TRACES_SAMPLING:1.0}
  opentelemetry:
    resource-attributes:
      # Общие признаки измерения повторяются в ресурсе сигнала: у метрик они общие теги, а у
      # трасс и журналов общих тегов нет, и без них в Tempo и Loki не видно, чей это инстанс —
      # у всех восьми одно и то же имя приложения. Тот же набор, что у метрик, и под теми же
      # именами. service.instance.id не задаётся намеренно: он превратился бы в признак instance
      # на рядах метрик, а этот признак у сборщика — адрес цели, и переопределять его нельзя.
      # Значения следуют за идентичностью из окружения (теми же цепочками дефолтов, что и сегменты
      # пути конфигурации): признак node обязан совпадать с именем инстанса, а группа — с сегментом
      # группы, иначе наблюдение и правила не сойдутся с путём в etcd.
      service: ${pool.etcd.service:unknown}
      group: ${pool.etcd.group:unknown}
      node: ${pool.etcd.instance:unknown}
  metrics:
    tags:
      # Общие признаки: сборщик раскладывает метрики по флоту и по инстансам без настройки
      # на своей стороне. Признак называется node, а не instance: instance у сборщика —
      # адрес цели, и переопределять его нельзя. Значения — те же цепочки дефолтов, что и для
      # сегментов пути конфигурации (см. pool.etcd): node = имя инстанса, иначе правила молчания
      # и сверки состава не найдут инстанс по имени узла регистрации.
      service: ${pool.etcd.service:unknown}
      group: ${pool.etcd.group:unknown}
      node: ${pool.etcd.instance:unknown}
  endpoint:
    health:
      show-details: always
      # Пробы регистрируют индикаторы readinessState/livenessState, без которых
      # группа readiness не сможет включить readinessState (валидация упадёт на старте).
      probes:
        enabled: true
      group:
        # Готовность: гейт конфигурации (readinessState + poolEtcd) и доступность базы.
        # Живость — только ping: процесс жив независимо от etcd и базы.
        readiness:
          include: readinessState,db,poolEtcd
        liveness:
          include: ping

# Локальная конфигурация пула: цель соединения и таймауты. Меняется только перезапуском, поэтому
# в etcd её нет. Размер пула приходит ТОЛЬКО etcd-конфигурацией провижера: локального размера нет
# вовсе, пул не создаётся, пока не пришёл первый конфиг, а нулевой целевой размер честно его
# закрывает с дренажом активных соединений.
pool:
  db:
    jdbc-url: ${DB_URL:jdbc:postgresql://localhost:5432/demo}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    pool-name: ${POOL_NAME:${pool.etcd.instance:}}
    connection-timeout-ms: ${POOL_CONNECTION_TIMEOUT_MS:30000}
    idle-timeout-ms: ${POOL_IDLE_TIMEOUT_MS:600000}
    max-lifetime-ms: ${POOL_MAX_LIFETIME_MS:1800000}
    validation-timeout-ms: ${POOL_VALIDATION_TIMEOUT_MS:5000}
    leak-detection-threshold-ms: ${POOL_LEAK_DETECTION_MS:0}
    # minimumIdle приходит из etcd и по умолчанию следует за maximumPoolSize
    # (как в HikariCP). Ужимать пул можно локально ключом etcd minimumIdle.
    initialization-fail-timeout-ms: -1
    eager-fill-on-resize: ${POOL_EAGER_FILL:true}
    # Сколько ждать активные соединения перед закрытием старого пула (пул сняли размером 0)
    drain-on-recreate-timeout: ${POOL_DRAIN_TIMEOUT:3s}
    register-mbeans: true
  etcd:
    enabled: ${ETCD_ENABLED:true}
    endpoints: ${ETCD_ENDPOINTS:http://localhost:2379}
    # Путь ключей: {root}/services/{service}/groups/{group}/instances/{instance}/hikari/.
    # group/instance — обязательные сегменты при enabled=true, и их имена приходят из окружения
    # развёртывания, а не из статического перечня стенда: явное значение (ETCD_GROUP/ETCD_INSTANCE)
    # имеет приоритет, затем имя пода/namespace (POD_NAME/POD_NAMESPACE), затем имя хоста (HOSTNAME;
    # в docker-контейнере это его короткий ID, на k8s имя пода приходит раньше).
    root: ${ETCD_ROOT:/config}
    service: ${SERVICE_NAME:${spring.application.name}}
    group: ${ETCD_GROUP:${POD_NAMESPACE:}}
    instance: ${ETCD_INSTANCE:${POD_NAME:${HOSTNAME:}}}
    call-timeout: ${ETCD_CALL_TIMEOUT:5s}
    retry-initial-backoff: ${ETCD_RETRY_INITIAL:1s}
    retry-max-backoff: ${ETCD_RETRY_MAX:30s}
    # TTL аренды узла регистрации инстанса; keepalive идёт каждые TTL/3.
    registration-ttl: ${ETCD_REGISTRATION_TTL:15s}
    # Публикация неосвобождённого сжатия (сколько соединений держим сверх потолка) — по аренде
    # узла, ключ рядом с узлом регистрации, вне hikari/. Публикуется по изменению величины.
    # publish-quantum: 0 = публиковать каждое изменение (по умолчанию); ненулевое значение
    # пропускает промежуточные значения мельче кванта, на терминальный ноль не действует.
    publish-quantum: ${ETCD_PUBLISH_QUANTUM:0}
    publish-poll-interval: ${ETCD_PUBLISH_POLL:1s}
    publish-idle-interval: ${ETCD_PUBLISH_IDLE:5s}

logging:
  level:
    com.abatalev.demo.etcdhikari.service: INFO
    com.zaxxer.hikari: INFO
    io.etcd.jetcd: WARN
